# Keeps SHA pins, version comments and lockfiles current (DEVOPS-12629).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/hack/tools"
      - "/staging/src/k8s.io/api"
      - "/staging/src/k8s.io/apiextensions-apiserver"
      - "/staging/src/k8s.io/apimachinery"
      - "/staging/src/k8s.io/apiserver"
      - "/staging/src/k8s.io/cli-runtime"
      - "/staging/src/k8s.io/client-go"
      - "/staging/src/k8s.io/cloud-provider"
      - "/staging/src/k8s.io/cluster-bootstrap"
      - "/staging/src/k8s.io/code-generator"
      - "/staging/src/k8s.io/component-base"
      - "/staging/src/k8s.io/component-helpers"
      - "/staging/src/k8s.io/controller-manager"
      - "/staging/src/k8s.io/cri-api"
      - "/staging/src/k8s.io/cri-client"
      - "/staging/src/k8s.io/csi-translation-lib"
      - "/staging/src/k8s.io/dynamic-resource-allocation"
      - "/staging/src/k8s.io/endpointslice"
      - "/staging/src/k8s.io/externaljwt"
      - "/staging/src/k8s.io/kms"
      - "/staging/src/k8s.io/kms/internal/plugins/_mock"
      - "/staging/src/k8s.io/kube-aggregator"
      - "/staging/src/k8s.io/kube-controller-manager"
      - "/staging/src/k8s.io/kube-proxy"
      - "/staging/src/k8s.io/kube-scheduler"
      - "/staging/src/k8s.io/kubectl"
      - "/staging/src/k8s.io/kubelet"
      - "/staging/src/k8s.io/metrics"
      - "/staging/src/k8s.io/mount-utils"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directories:
      - "/build/build-image"
      - "/build/pause"
      - "/build/server-image"
      - "/build/server-image/kube-apiserver"
      - "/build/server-image/kubectl"
      - "/cluster/addons/addon-manager"
      - "/cluster/gce/gci/mounter"
      - "/cluster/images/etcd"
      - "/cluster/images/etcd-version-monitor"
      - "/cluster/images/kubemark"
      - "/staging/src/k8s.io/apiextensions-apiserver/artifacts/simple-image"
      - "/staging/src/k8s.io/kms/internal/plugins/_mock"
      - "/staging/src/k8s.io/kube-aggregator/artifacts/simple-image"
      - "/staging/src/k8s.io/pod-security-admission/webhook"
      - "/staging/src/k8s.io/sample-apiserver/artifacts/simple-image"
      - "/test/conformance/image"
      - "/test/e2e_node/conformance/build"
      - "/test/images/agnhost"
      - "/test/images/apparmor-loader"
      - "/test/images/busybox"
      - "/test/images/httpd"
      - "/test/images/httpd-new"
      - "/test/images/ipc-utils"
      - "/test/images/jessie-dnsutils"
      - "/test/images/kitten"
      - "/test/images/nautilus"
      - "/test/images/nginx"
      - "/test/images/nginx-new"
      - "/test/images/node-perf/npb-ep"
      - "/test/images/node-perf/npb-is"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
